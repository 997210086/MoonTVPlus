name: One-time MoonTV DNS Cutover

on:
  push:
    paths:
      - .github/workflows/cutover-moontv-dns.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Point moomtv.990720.xyz to the direct US origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: 990720.xyz
          RECORD_NAME: moomtv.990720.xyz
          TARGET_IP: 38.14.193.154
        run: |
          set -euo pipefail

          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zones=$(curl --silent --show-error --fail-with-body \
            -H "$auth_header" \
            "$api/zones?name=$ZONE_NAME")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zones")
          if [ -z "$zone_id" ]; then
            echo "Unable to find Cloudflare zone: $ZONE_NAME" >&2
            exit 1
          fi

          records=$(curl --silent --show-error --fail-with-body \
            -H "$auth_header" \
            "$api/zones/$zone_id/dns_records?name=$RECORD_NAME")
          record_id=$(jq -r '.result[0].id // empty' <<<"$records")
          if [ -z "$record_id" ]; then
            echo "Unable to find DNS record: $RECORD_NAME" >&2
            exit 1
          fi

          {
            echo "### DNS rollback record"
            echo
            echo '```json'
            jq '.result[0] | {id,type,name,content,proxied,ttl,comment,tags}' <<<"$records"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          current_type=$(jq -r '.result[0].type' <<<"$records")
          current_content=$(jq -r '.result[0].content' <<<"$records")
          current_proxied=$(jq -r '.result[0].proxied' <<<"$records")
          if [ "$current_type" = 'A' ] && [ "$current_content" = "$TARGET_IP" ] && [ "$current_proxied" = 'false' ]; then
            echo "DNS is already on the direct US origin."
            exit 0
          fi

          payload=$(jq -cn \
            --arg name "$RECORD_NAME" \
            --arg content "$TARGET_IP" \
            '{type:"A",name:$name,content:$content,ttl:60,proxied:false,comment:"MoonTV direct US 4837 origin; rollback info in workflow run summary"}')

          response=$(curl --silent --show-error --fail-with-body \
            --request PUT \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$api/zones/$zone_id/dns_records/$record_id")

          success=$(jq -r '.success' <<<"$response")
          new_type=$(jq -r '.result.type // empty' <<<"$response")
          new_content=$(jq -r '.result.content // empty' <<<"$response")
          new_proxied=$(jq -r '.result.proxied // empty' <<<"$response")
          if [ "$success" != 'true' ] || [ "$new_type" != 'A' ] || [ "$new_content" != "$TARGET_IP" ] || [ "$new_proxied" != 'false' ]; then
            echo "Cloudflare DNS update verification failed." >&2
            jq '{success,errors,result:{type:.result.type,name:.result.name,content:.result.content,proxied:.result.proxied,ttl:.result.ttl}}' <<<"$response" >&2
            exit 1
          fi

          {
            echo
            echo "### Cutover completed"
            echo
            echo "- Record: \`$RECORD_NAME\`"
            echo "- Type: \`A\`"
            echo "- Target: \`$TARGET_IP\`"
            echo "- Proxy: disabled (DNS only)"
            echo "- TTL: 60 seconds"
          } >> "$GITHUB_STEP_SUMMARY"
