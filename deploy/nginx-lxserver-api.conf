limit_req_zone $binary_remote_addr zone=lxserver_music_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name lx.38-14-193-154.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lx.38-14-193-154.sslip.io;

    ssl_certificate /etc/letsencrypt/live/lx.38-14-193-154.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lx.38-14-193-154.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lxserver_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 8m;
    keepalive_timeout 65;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /api/music/ {
        limit_req zone=lxserver_music_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:19527;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
